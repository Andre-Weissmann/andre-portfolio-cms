<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-dot {
      width: 10px;
      height: 10px;
      background: #01696F;
      border-radius: 50%;
    }
    .logo-text {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    input:focus { border-color: #01696F; }
    button {
      width: 100%;
      background: #01696F;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 4px;
    }
    button:hover { background: #0C4E54; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(161,44,123,0.12);
      border: 1px solid rgba(161,44,123,0.3);
      color: #D163A7;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">Portfolio Admin</span>
    </div>
    <h1>Sign in</h1>
    <p class="subtitle">Private access only</p>

    <div class="error" id="err">Incorrect email or password.</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />

      <button type="submit" id="btn">Sign in</button>
    </form>
  </div>

  <script>
    var _PORT = '__PORT_5000__';
    var API_BASE = _PORT.startsWith('__') ? '' : '/' + _PORT;

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          // Store token and redirect to admin dashboard
          sessionStorage.setItem('adminToken', data.token);
          window.location.href = '/admin';
        } else {
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      } catch {
        err.textContent = 'Connection error. Try again.';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
