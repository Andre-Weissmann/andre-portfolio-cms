<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bike Sales · Interactive board</title>
<meta name="description" content="Interactive Excel dashboard replica by Andre Weissmann." />
<style>
  :root {
    --bg: #f3f2f1;
    --ink: #252423;
    --muted: #605e5c;
    --line: #d2d0ce;
    --panel: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .board-top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 48px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  .board-top a {
    color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600;
  }
  .board-top a:hover { color: var(--ink); }
  .board-title { font-size: 14px; font-weight: 700; color: var(--ink); }
  .board-badge {
    font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); background: #fff;
  }
  .board-main { max-width: 1180px; margin: 0 auto; padding: 14px 12px 40px; }
  .board-hint {
    margin: 0 0 12px; font-size: 13px; color: var(--muted); line-height: 1.45;
  }
  .board-stage {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    min-height: 420px;
    overflow: auto;
  }

  .board-badge { color: #217346; border-color: color-mix(in srgb, #217346 40%, #ccc); background: color-mix(in srgb, #217346 10%, #fff); }
</style>
</head>
<body>
  <header class="board-top">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <a href="portfolio.html">&larr; Portfolio</a>
      <span class="board-title">Bike Sales · Interactive board</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="board-badge">Excel replica</span>
    </div>
  </header>
  <main class="board-main">
    <p class="board-hint">Use the left slicers to filter all charts at once. Interactive replica of the Excel pivot and slicer dashboard.</p>
    <div class="board-stage">
      <div id="excel-bike-dashboard"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="excel.js?v=1785046000"></script>
</body>
</html>
